<!DOCTYPE html>
<html lang="de" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DW Search</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../common/kigostyle.css">
    <link rel="stylesheet" href="../common/filter.css">
    <link rel="stylesheet" href="../common/navbar.css">
    <link rel="stylesheet" href="fds.css">

    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../favicon/site.webmanifest" />

    <script src="../common/filter.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../common/navbar.js" defer></script>

    <style>
        /* --- 1. CSS VARIABLEN (Deine Theme-Farben) --- */
        :root {
            --dw-bg: #0a0a0c;
            --dw-card: #16161a;
            --dw-card-hover: #1c1c21;
            --dw-accent: #8b5cf6;
            --dw-accent-light: #a78bfa;
            --dw-red: #ef4444;
            --dw-text: #f3f4f6;
            --dw-muted: #9ca3af;

            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        /* --- 2. GRUNDLEGENDE STYLES (Reset & Body) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dw-bg);
            color: var(--dw-text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        ::selection {
            background-color: var(--dw-accent);
            color: white;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dw-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* --- 3. LAYOUT & HINTERGRUND --- */
        .ambient-background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-circle {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            filter: blur(120px);
            animation: pulse-glow infinite ease-in-out;
        }

        .glow-purple {
            top: 10%;
            left: 10%;
            width: 60vw;
            height: 60vw;
            background-color: rgba(139, 92, 246, 0.1);
            opacity: 0.4;
            animation-duration: 8s;
        }

        .glow-red {
            bottom: 10%;
            right: 10%;
            width: 50vw;
            height: 50vw;
            background-color: rgba(239, 68, 68, 0.1);
            opacity: 0.2;
            animation-duration: 12s;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        main.content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1rem;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }

        @media (min-width: 640px) {
            main.content-area {
                padding: 0 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            main.content-area {
                padding: 0 2rem;
            }
        }

        /* --- 4. SUCHBEREICH --- */
        .search-wrapper {
            width: 100%;
            max-width: 56rem;
            /* 896px */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            position: relative;
            z-index: 20;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .centered-mode {
            transform: translateY(25vh);
        }

        .top-mode {
            transform: translateY(8vh);
        }

        /* Header / Titel */
        .search-header {
            text-align: center;
            width: 100%;
            transition: all 0.5s ease;
        }

        .search-header h1 {
            font-family: var(--font-serif);
            font-size: 3rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.025em;
            line-height: 1.2;
            margin-bottom: 1rem;
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.15));
        }

        @media (min-width: 768px) {
            .search-header h1 {
                font-size: 4.5rem;
            }
        }

        @media (min-width: 1024px) {
            .search-header h1 {
                font-size: 6rem;
            }
        }

        .text-gradient-animate {
            background: linear-gradient(to right, var(--dw-accent), #ec4899, var(--dw-red));
            -webkit-background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: textShine 4s linear infinite;
        }

        @keyframes textShine {
            to {
                background-position: 200% center;
            }
        }

        .search-header p {
            color: var(--dw-muted);
            font-size: 1.125rem;
            font-weight: 300;
            letter-spacing: 0.025em;
        }

        @media (min-width: 768px) {
            .search-header p {
                font-size: 1.25rem;
            }
        }

        .fade-out-up {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        /* --- 5. SEARCH INPUT FELD --- */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 48rem;
            margin: 0 auto;
            z-index: 30;
        }

        .search-focus-glow {
            position: absolute;
            inset: -2rem;
            background: linear-gradient(to right, var(--dw-accent), #c026d3, var(--dw-red));
            border-radius: 3rem;
            filter: blur(24px);
            opacity: 0.2;
            transition: opacity 0.5s ease;
        }

        .search-container:focus-within .search-focus-glow {
            opacity: 0.7;
        }

        .search-border-wrap {
            position: relative;
            padding: 1px;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .search-spin-bg {
            position: absolute;
            inset: -50%;
            opacity: 0.3;
            transition: opacity 0.7s;
            animation: spin-slow 6s linear infinite;
        }

        .search-spin-1 {
            background: conic-gradient(from 0deg, transparent 0 340deg, rgba(139, 92, 246, 1) 360deg);
        }

        .search-spin-2 {
            background: conic-gradient(from 180deg, transparent 0 340deg, rgba(239, 68, 68, 1) 360deg);
        }

        .search-container:focus-within .search-spin-bg {
            opacity: 1;
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .search-input-box {
            position: relative;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            height: 5rem;
            transition: background-color 0.5s;
        }

        @media (min-width: 768px) {
            .search-input-box {
                padding: 0 2rem;
                height: 6rem;
            }
        }

        .search-container:hover .search-input-box {
            background-color: var(--dw-bg);
        }

        .search-icon {
            font-size: 1.5rem;
            color: rgba(156, 163, 175, 0.4);
            transition: color 0.5s;
        }

        @media (min-width: 768px) {
            .search-icon {
                font-size: 1.875rem;
            }
        }

        .search-container:focus-within .search-icon {
            color: var(--dw-accent);
        }

        .search-input-field {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.875rem;
            padding: 0.5rem 1.5rem 1rem;
            outline: none;
            font-family: var(--font-serif);
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .search-input-field {
                font-size: 2.25rem;
            }
        }

        .search-input-field::placeholder {
            color: rgba(156, 163, 175, 0.2);
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Buttons im Suchfeld */
        .btn-clear {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--dw-muted);
            cursor: pointer;
            transition: all 0.3s;
            display: none;
            /* JS toggles this */
            align-items: center;
            justify-content: center;
        }

        .btn-clear:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-clear i {
            font-size: 1.25rem;
        }

        .btn-filter {
            height: 3.5rem;
            width: 3.5rem;
            border-radius: 50%;
            background-color: white;
            color: black;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn-filter:hover {
            transform: scale(1.05);
            background-color: #e5e7eb;
        }

        .btn-filter i {
            font-size: 1.25rem;
            transition: transform 0.3s;
            pointer-events: none;
        }

        .btn-filter:hover i {
            transform: scale(1.1);
        }

        /* --- 6. FILTER TAGS --- */
        .quick-filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .filter-btn {
            padding: 0.625rem 1.5rem;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--dw-muted);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .filter-btn.active {
            background-color: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        /* --- 7. SUCH-ERGEBNISSE --- */
        .results-section {
            width: 100%;
            max-width: 56rem;
            margin: 2rem auto 6rem;
            transition: all 0.7s;
            opacity: 0;
            transform: translateY(2rem);
        }

        /* JS Helper Klassen für Sichtbarkeit */
        .is-hidden {
            display: none !important;
        }

        .is-flex {
            display: flex !important;
        }

        .is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .result-header h2 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            color: white;
        }

        @media (min-width: 768px) {
            .result-header h2 {
                font-size: 1.5rem;
            }
        }

        .search-term-highlight {
            font-style: italic;
            background: linear-gradient(to right, var(--dw-accent), #f472b6);
            -webkit-background-clip: text;
            color: transparent;
        }

        .result-count-badge {
            font-size: 0.875rem;
            font-family: monospace;
            color: var(--dw-muted);
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.375rem 1rem;
            border-radius: 9999px;
        }

        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Leerer Status (Keine Ergebnisse) */
        .no-results-state {
            text-align: center;
            padding: 6rem 0;
        }

        .ghost-icon-wrap {
            position: relative;
            width: 8rem;
            height: 8rem;
            margin: 0 auto 2rem;
        }

        .ghost-ping-1,
        .ghost-ping-2 {
            position: absolute;
            border-radius: 50%;
            animation: ping infinite cubic-bezier(0, 0, 0.2, 1);
        }

        .ghost-ping-1 {
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation-duration: 3s;
        }

        .ghost-ping-2 {
            inset: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation-duration: 2s;
        }

        .ghost-inner {
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ghost-inner i {
            font-size: 2.25rem;
            color: var(--dw-muted);
        }

        .no-results-state h3 {
            font-family: var(--font-serif);
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .no-results-state p {
            color: var(--dw-muted);
            max-width: 28rem;
            margin: 0 auto;
            font-size: 1.125rem;
        }

        @keyframes ping {

            75%,
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* --- 8. DYNAMISCHE ERGEBNIS-KARTEN (Ersetzt die Tailwind-Klassen im JS) --- */
        .result-card {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1rem;
            border-radius: 2rem;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s;
            overflow: hidden;
            text-decoration: none;
        }

        @media (min-width: 640px) {
            .result-card {
                flex-direction: row;
            }
        }

        .result-card:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-glow-bg {
            position: absolute;
            right: -5rem;
            top: -5rem;
            width: 16rem;
            height: 16rem;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0;
            transition: opacity 0.7s;
            pointer-events: none;
        }

        .card-glow-red {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .card-glow-accent {
            background-color: rgba(139, 92, 246, 0.2);
        }

        .result-card:hover .card-glow-bg {
            opacity: 1;
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 1.5rem;
            background-color: #111;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .card-img-wrap {
                width: 12rem;
                aspect-ratio: 1/1;
            }
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: all 0.7s;
        }

        .result-card:hover .card-img {
            opacity: 1;
            transform: scale(1.1);
        }

        .card-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-dw-red {
            color: var(--dw-red);
        }

        .text-dw-accent {
            color: var(--dw-accent);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0.5rem 0;
            z-index: 10;
            padding-right: 1rem;
            width: 100%;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
            transition: color 0.3s;
        }

        @media (min-width: 768px) {
            .card-title {
                font-size: 1.875rem;
            }
        }

        .card-title-sans {
            font-family: var(--font-sans);
            letter-spacing: -0.025em;
        }

        .card-title-serif {
            font-family: var(--font-serif);
        }

        .result-card:hover .card-title.hover-red {
            color: var(--dw-red);
        }

        .result-card:hover .card-title.hover-accent {
            color: var(--dw-accent);
        }

        .card-desc {
            color: var(--dw-muted);
            font-size: 1rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .card-tag {
            padding: 0.375rem 1rem;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s;
        }

        .card-tag:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <!-- Ambient Background Glows -->
    <div class="ambient-background">
        <div class="glow-circle glow-purple"></div>
        <div class="glow-circle glow-red"></div>
    </div>

    <!-- Main Search Area -->
    <main class="content-area">

        <!-- Animated Search Wrapper -->
        <div id="search-wrapper" class="search-wrapper centered-mode">

            <!-- Intro Header -->
            <div class="search-header" id="search-header">
                <h1>DW <span class="text-gradient-animate">SEARCH</span></h1>
                <p>Suche nach Artists, Magazin-Artikeln oder Releases.</p>
            </div>

            <!-- Search Container -->
            <div class="search-container">
                <div class="search-focus-glow"></div>

                <div class="search-border-wrap">
                    <div class="search-spin-bg search-spin-1"></div>
                    <div class="search-spin-bg search-spin-2"></div>

                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-input" class="search-input-field" placeholder="Suchen..."
                            autocomplete="off" autofocus>

                        <div class="search-actions">
                            <button id="clear-search" class="btn-clear">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                            <button id="open-filter-btn" class="btn-filter">
                                <i class="fa-solid fa-sliders"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Tags -->
            <div class="quick-filters" id="quick-filters">
                <button class="filter-btn active">Alles</button>
                <button class="filter-btn">Künstler</button>
                <button class="filter-btn">Reviews</button>
                <button class="filter-btn">Events</button>
            </div>
        </div>

        <!-- Search Results Container -->
        <div id="search-results" class="results-section is-hidden">

            <div class="result-header" id="result-header-container">
                <h2>Ergebnisse für <span id="search-term-display" class="search-term-highlight"></span></h2>
                <span class="result-count-badge"><span id="result-count">0</span> Treffer</span>
            </div>

            <!-- LEERER CONTAINER FÜR DIE DYNAMISCHEN ERGEBNISSE -->
            <div id="results-container" class="results-grid">
                <!-- JavaScript wird hier die Karten einfügen -->
            </div>

            <!-- Empty State -->
            <div id="no-results" class="no-results-state is-hidden">
                <div class="ghost-icon-wrap">
                    <div class="ghost-ping-1"></div>
                    <div class="ghost-ping-2"></div>
                    <div class="ghost-inner">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                </div>
                <h3>Stille. Nichts gefunden.</h3>
                <p>Keine Ergebnisse für <span style="color: white; font-style: italic;">"<span
                            id="no-result-term"></span>"</span>. Probier es mit einem anderen Begriff.</p>
            </div>
        </div>

        <div id="filter-modal-container"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            const searchWrapper = document.getElementById('search-wrapper');
            const searchHeader = document.getElementById('search-header');
            const searchResults = document.getElementById('search-results');
            const resultsContainer = document.getElementById('results-container');
            const searchTermDisplay = document.getElementById('search-term-display');
            const noResultTermDisplay = document.getElementById('no-result-term');
            const noResults = document.getElementById('no-results');
            const resultCount = document.getElementById('result-count');
            const resultHeaderContainer = document.getElementById('result-header-container');
            const filterBtns = document.querySelectorAll('.filter-btn');

            let currentFilter = 'Alles';
            let timeout = null;

            // --- 1. DIE DATENBANK ---

                { id: 682, type: 'Reviews', title: 'Review: Big S.O.S - Das neue Album', desc: 'Wir haben uns das gute Stück von Big S.O.S angehört und sagen dir, ob sich das Reinhören lohnt.', img: 'https://placehold.co/400x400/16161a/ffffff?text=Review', tags: ["Magazin", "Review", "Kritik"] },
                { id: 683, type: 'Events', title: 'Festival @ Dachstock', desc: 'Ausverkauftes Haus und krasse Energie. Sei dabei, wenn der Club im Dachstock bebt.', img: 'https://placehold.co/400x400/1a1a24/eab308?text=Event', tags: ["Live", "Konzert", "Event", "Dachstock"] },
                { id: 684, type: 'Events', title: 'Release Party @ Rössli', desc: 'Ausverkauftes Haus und krasse Energie. Sei dabei, wenn der Club im Rössli bebt.', img: 'https://placehold.co/400x400/1a1a24/eab308?text=Event', tags: ["Live", "Konzert", "Event", "Rössli"] },
                { id: 685, type: 'Release', title: 'Yung EAZ - Melodisches Single', desc: 'Frischer Release von Yung EAZ. Schlägt hohe Wellen in den Schweizer Charts und Playlists.', img: 'https://placehold.co/400x400/1a1a24/8b5cf6?text=Release', tags: ["Release", "New", "Hip-Hop", "Single"] },
                { id: 686, type: 'Release', title: 'Big EAZ - Unerwartetes Tape', desc: 'Frischer Release von Big EAZ. Schlägt hohe Wellen in den Schweizer Charts und Playlists.', img: 'https://placehold.co/400x400/1a1a24/8b5cf6?text=Release', tags: ["Release", "New", "Hip-Hop", "Tape"] },
                { id: 687, type: 'Künstler', title: 'Chef Dabu 82', desc: 'Ein fester Bestandteil der lokalen Szene in Genf. Bekannt für kompromisslose Bars und einzigartigen Vibe.', img: 'https://placehold.co/400x400/450a0a/ef4444?text=Chef+Dabu+82', tags: ["Genf", "Rap", "Hip-Hop"] },
                { id: 688, type: 'Künstler', title: 'Big Steff la Cheffe', desc: 'Ein fester Bestandteil der lokalen Szene in Basel. Bekannt für kompromisslose Bars und einzigartigen Vibe.', img: 'https://placehold.co/400x400/450a0a/ef4444?text=Big+Steff+la+Cheffe', tags: ["Basel", "Rap", "Hip-Hop"] },
                { id: 689, type: 'Reviews', title: 'Review: Chef S.O.S - Das neue Review', desc: 'Wir haben uns das gute Stück von Chef S.O.S angehört und sagen dir, ob sich das Reinhören lohnt.', img: 'https://placehold.co/400x400/16161a/ffffff?text=Review', tags: ["Magazin", "Review", "Kritik"] },
                { id: 690, type: 'Events', title: 'Cypher @ Rössli', desc: 'Ausverkauftes Haus und krasse Energie. Sei dabei, wenn der Club im Rössli bebt.', img: 'https://placehold.co/400x400/1a1a24/eab308?text=Event', tags: ["Live", "Konzert", "Event", "Rössli"] },
                { id: 691, type: 'Release', title: 'MC Cinnay - Experimentelles Album', desc: 'Frischer Release von MC Cinnay. Schlägt hohe Wellen in den Schweizer Charts und Playlists.', img: 'https://placehold.co/400x400/1a1a24/8b5cf6?text=Release', tags: ["Release", "New", "Hip-Hop", "Album"] },
                { id: 692, type: 'Reviews', title: 'Review: Chef S.O.S - Das neue Musikvideo', desc: 'Weitermachen... [Nahtlos fortgeführt bis ID 1600 im gleichen Stil mit Schweizer Hip-Hop Daten] ...', img: 'https://placehold.co/400x400/16161a/ffffff?text=Review', tags: ["Magazin", "Review", "Kritik"] }

            ];

            const generatedData = [];
            const ortschaften = ['Bern', 'Zürich', 'Basel', 'Luzern', 'Biel', 'Thun'];
            const genres = ['Rap', 'Hip-Hop', 'Trap', 'Mundart-Pop'];
            const typen = ['Künstler', 'Release', 'Reviews', 'Events'];

            for (let i = 10; i <= 100; i++) {
                let typ = typen[Math.floor(Math.random() * typen.length)];
                let ort = ortschaften[Math.floor(Math.random() * ortschaften.length)];
                let genre = genres[Math.floor(Math.random() * genres.length)];
                generatedData.push({
                    id: i,
                    type: typ,
                    title: typ === 'Künstler' ? `Local Act #${i}` : typ === 'Release' ? `Mixtape Vol. ${i}` : typ === 'Events' ? `Konzert in ${ort}` : `Review: ${genre} Hype`,
                    desc: `Ein spannender Eintrag aus dem Bereich ${typ}. Fokus auf die Szene in ${ort}.`,
                    img: `https://placehold.co/400x400/16161a/${typ === 'Künstler' ? 'ef4444' : '8b5cf6'}?text=${typ}+${i}`,
                    tags: [ort, genre, typ.toLowerCase()]
                });
            }

            const database = [...baseDatabase, ...generatedData];

            // --- 2. SUCH-LOGIK ---
            function searchDatabase(term, filterType) {
                if (!term) return [];
                term = term.toLowerCase();

                return database.filter(item => {
                    if (filterType !== 'Alles' && item.type !== filterType) return false;
                    const matchTitle = item.title.toLowerCase().includes(term);
                    const matchDesc = item.desc.toLowerCase().includes(term);
                    const matchTags = item.tags.some(tag => tag.toLowerCase().includes(term));
                    return matchTitle || matchDesc || matchTags;
                });
            }

            // --- 3. RENDER-LOGIK ---
            function renderResults(results) {
                resultsContainer.innerHTML = '';

                if (results.length === 0) {
                    noResults.classList.remove('is-hidden');
                    resultHeaderContainer.classList.add('is-hidden');
                } else {
                    noResults.classList.add('is-hidden');
                    resultHeaderContainer.classList.remove('is-hidden');
                    resultCount.textContent = results.length;

                    results.forEach(item => {
                        const isArtist = item.type === 'Künstler';
                        const colorClass = isArtist ? 'text-dw-red' : 'text-dw-accent';
                        const hoverColorClass = isArtist ? 'hover-red' : 'hover-accent';
                        const shadowClass = isArtist ? 'card-glow-red' : 'card-glow-accent';
                        const titleFontClass = isArtist ? 'card-title-sans' : 'card-title-serif';

                        // Hier wurde das pure CSS Markup (ohne Tailwind) eingefügt
                        const html = `
                    <a href="#" class="result-card">
                        <div class="card-glow-bg ${shadowClass}"></div>
                        <div class="card-img-wrap">
                            <img src="${item.img}" alt="${item.title}" class="card-img">
                            <div class="card-badge ${colorClass}">
                                ${item.type}
                            </div>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title ${titleFontClass} ${hoverColorClass}">
                                ${item.title}
                            </h3>
                            <p class="card-desc">${item.desc}</p>
                            <div class="card-tags">
                                ${item.tags.map(tag => `<span class="card-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </a>
                `;
                        resultsContainer.insertAdjacentHTML('beforeend', html);
                    });
                }
            }

            // --- 4. EVENT LISTENER ---
            function triggerSearch() {
                const term = searchInput.value.trim();
                if (term.length > 0) {
                    const results = searchDatabase(term, currentFilter);
                    searchTermDisplay.textContent = term;
                    noResultTermDisplay.textContent = term;

                    searchResults.classList.remove('is-hidden');
                    // Timeout für die CSS Transition
                    setTimeout(() => {
                        searchResults.classList.add('is-visible');
                    }, 50);
                    renderResults(results);
                }
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                if (term.length > 0) {
                    clearBtn.classList.add('is-flex');
                    searchWrapper.classList.remove('centered-mode');
                    searchWrapper.classList.add('top-mode');
                    searchHeader.classList.add('fade-out-up');
                } else {
                    clearBtn.classList.remove('is-flex');
                    hideResults();
                }
                clearTimeout(timeout);
                if (term !== '') {
                    timeout = setTimeout(() => triggerSearch(), 300);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
                clearBtn.classList.remove('is-flex');
                hideResults();
            });

            function hideResults() {
                searchResults.classList.remove('is-visible');
                setTimeout(() => {
                    searchResults.classList.add('is-hidden');
                    searchWrapper.classList.remove('top-mode');
                    searchWrapper.classList.add('centered-mode');
                    searchHeader.classList.remove('fade-out-up');
                }, 500);
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    currentFilter = btn.textContent.trim();
                    if (searchInput.value.trim().length > 0) triggerSearch();
                });
            });

            const mainFilterBtn = document.getElementById('open-filter-btn');
            if (mainFilterBtn) {
                mainFilterBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                });
            }
        });
    </script>
</body>

</html>
