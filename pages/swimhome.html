<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="../common/kigostyle.css">
  <link rel="stylesheet" href="../common/filter.css">
  <link rel="stylesheet" href="../common/navbar.css">
  <link rel="stylesheet" href="swimhome.css">
  <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
  <link rel="shortcut icon" href="../favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <link rel="manifest" href="../favicon/site.webmanifest" />
  <script src="../common/filter.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../common/navbar.js" defer></script>
  <title>DW Swim Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>


  <div id="navbar-placeholder"></div>
  <img src="../images/gino.jpg" alt="Artist Image" id="background-img">

  <div class="bento-grid" id="mainContainer">
    <div class="mobile-drawer-wrapper" id="mobileDrawer">

      <!-- NEU: Der Button ist jetzt HIER drinnen -->
      <button class="mobile-toggle-btn" onclick="toggleMobilePanel()">
        <span class="music-note"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </span>
        <span id="drawerArrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </span>
        <span class="music-note"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </span>
      </button>


      <div class="card-background">
        <div class="bento-card card-buttons">
          <button class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5"></line>
            </svg>
          </button>
          <button class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
              fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>
          <button class="nav-btn" id="like-button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
              </path>
            </svg>
          </button>
          <button class="nav-btn" id="open-filter-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <!-- Obere Reihe -->
              <line x1="3" y1="6" x2="11" y2="6"></line>
              <circle cx="14" cy="6" r="2"></circle>
              <line x1="17" y1="6" x2="21" y2="6"></line>

              <!-- Mittlere Reihe -->
              <line x1="3" y1="12" x2="5" y2="12"></line>
              <circle cx="8" cy="12" r="2"></circle>
              <line x1="11" y1="12" x2="21" y2="12"></line>

              <!-- Untere Reihe -->
              <line x1="3" y1="18" x2="13" y2="18"></line>
              <circle cx="16" cy="18" r="2"></circle>
              <line x1="19" y1="18" x2="21" y2="18"></line>
            </svg>

          </button>
        </div>
        <div class="bento-card card-profile">
          <img src="../images/gino.jpg" alt="Artist Image" id="profile-img">
          <div class="profile-info">
            <h1>gino</h1>
          </div>
        </div>

        <div class="bento-card card-youtube">
          <iframe src="https://www.youtube.com/embed/1RxQHtQdG1I?si=RUqgPebGbfPQQ1Ow" title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
        </div>
      </div>

    </div>
    <div class="bento-card card-game">
      <iframe src="..\game\index.html" title="Swim Home"></iframe>
    </div>

  </div>
  <!-- Das Pop-up (Modal) -->
  <div id="filter-modal" class="modal-overlay">
    <!-- Die eigentliche Filter-Box -->
    <div class="bento-card filter-card">

      <!-- Ein Schließen-Button (X) -->
      <button id="close-filter-btn" class="close-btn">&times;</button>

      <!-- Hier fügst du später den HTML-Code für dein Filter-Menü (Dialekt, Slider etc.) ein -->
      <div class="dropdown-row">
        <div class="custom-select-wrapper" id="sel-dialekt">
          <div class="custom-select-trigger"><span>Dialekt</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">
            <span class="custom-option" data-value="be">Bärndütsch</span>
            <span class="custom-option" data-value="zh">Züridütsch</span>
            <span class="custom-option" data-value="bs">Baseldütsch</span>
          </div>
          <input type="hidden" class="hidden-val" value="">
        </div>
        <div class="custom-select-wrapper" id="sel-genre">
          <div class="custom-select-trigger"><span>Genre</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">
            <span class="custom-option" data-value="rap">Rap</span>
            <span class="custom-option" data-value="drill">Drill</span>
            <span class="custom-option" data-value="pop">Pop</span>
          </div>
          <input type="hidden" class="hidden-val" value="">
        </div>
        <div class="custom-select-wrapper" id="sel-aktiv">
          <div class="custom-select-trigger"><span>Aktiv seit</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">
            <span class="custom-option" data-value="2020">2020+</span>
            <span class="custom-option" data-value="2015">2015+</span>
            <span class="custom-option" data-value="alle">Alle</span>
          </div>
          <input type="hidden" class="hidden-val" value="">
        </div>
      </div>

      <div class="slider-section">
        <div class="section-title">Zuhörerspanne (Spotify)</div>
        <div class="histogram" id="histogram"></div>
        <div class="slider-wrapper">
          <div class="slider-track"></div>
          <div class="slider-fill" id="slider-fill"></div>
          <input type="range" min="0" max="300" value="0" id="slider-min">
          <input type="range" min="0" max="300" value="300" id="slider-max">
        </div>
        <div class="min-max-row">
          <div class="input-group">
            <span class="input-label">Minimum</span>
            <input type="text" class="input-box" id="input-min" value="0">
          </div>
          <div class="input-group" style="align-items: flex-end;">
            <span class="input-label">Maximum</span>
            <input type="text" class="input-box" id="input-max" value="300k">
          </div>
        </div>
      </div>

    </div>
  </div>
  <script>
    // JavaScript für das Handy zum Öffnen/Schließen
    function toggleMobilePanel() {
      const drawer = document.getElementById('mobileDrawer');
      const arrow = document.getElementById('drawerArrow'); // Zielt nur auf den Pfeil

      drawer.classList.toggle('open');

      // Pfeilrichtung ändern
      if (drawer.classList.contains('open')) {
        arrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
      } else {
        arrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
      }
    }

    // Wähle den Button aus (hier angenommen, er hat die ID "like-button")
    const likeButton = document.getElementById('like-button');

    // Füge einen Klick-Zuhörer (Event Listener) hinzu
    likeButton.addEventListener('click', function () {
      // 'toggle' fügt die Klasse 'liked' hinzu, wenn sie fehlt, 
      // und entfernt sie, wenn sie bereits da ist.
      this.classList.toggle('liked');
    });

    // Elemente aus dem HTML auswählen
    const openBtn = document.getElementById('open-filter-btn');
    const closeBtn = document.getElementById('close-filter-btn');
    const modal = document.getElementById('filter-modal');

    // Öffnen: Klick auf das Filter-Symbol
    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    // Schließen: Klick auf das "X"
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // Optionaler Bonus: Schließen, wenn man außerhalb der Box auf den dunklen Hintergrund klickt
    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.classList.remove('active');
      }
    });
  </script>

</body>

</html>
