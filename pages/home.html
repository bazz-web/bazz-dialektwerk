<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DW Home</title>
    <link rel="stylesheet" href="../common/kigostyle.css">
    <link rel="stylesheet" href="../common/navbar.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../common/navbar.js" defer></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Hier kommen die separaten Stylesheets für deine Karten rein -->
    <link rel="stylesheet" href="../cards/card1.css">
    <link rel="stylesheet" href="../cards/card2.css">
    <link rel="stylesheet" href="../cards/card3.css">
    <link rel="stylesheet" href="../cards/card4.css">
    <link rel="stylesheet" href="../cards/card5.css">

    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../favicon/site.webmanifest" />

    <style>
        :root {
            --dw-accent: #8b5cf6;
            --dw-muted: #9ca3af;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }


        body::-webkit-scrollbar {
            display: none;
        }

        /* 3D Scene Setup */
        .scene {
            perspective: 2500px;
            transform-style: preserve-3d;
        }

        #carousel .bento-card {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            border-radius: 2rem;
            padding: 1.5rem;
            transform-style: preserve-3d;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive 3D Scene - Urspruengliche, perfekt funktionierende Werte */
        .dynamic-scene {
            position: absolute;
            pointer-events: auto;
            perspective: 2500px;
            top: calc(50% + 20px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 70vh;
        }

        @media (min-width: 900px) {
            .dynamic-scene {
                top: 50%;
                left: max(265px, calc(50vw - min(35vw, 550px)));
                transform: translateY(-50%);
                width: min(70vw, 1100px, calc(100vw - 230px - 120px));
                height: 70vh;
            }
        }

        /* Main Container Overlay */
        .main-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        .carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .loading-text {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Search Bar Overlay Styles */
        .search-overlay {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            z-index: 100;
            pointer-events: auto;
        }

        .search-bar-wrapper {
            max-width: 700px;
            margin: 0 auto;
        }

        .search-bar-link {
            display: block;
            position: relative;
            padding: 1px;
            border-radius: 2rem;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-decoration: none;
        }

        .search-bar-link:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .search-bar-inner {
            position: relative;
            background-color: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            display: flex;
            align-items: center;
            padding: 0.5rem 1.5rem;
            height: 2.25rem;
            transition: all 0.3s ease;
        }

        .search-icon {
            font-size: 1.125rem;
            color: var(--dw-muted);
            transition: color 0.3s ease;
        }

        .search-bar-link:hover .search-icon {
            color: var(--dw-accent);
        }

        .search-text {
            margin-left: 1rem;
            color: rgba(156, 163, 175, 0.8);
            font-size: 1rem;
            font-family: var(--font-serif);
            letter-spacing: 0.025em;
            transition: color 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-bar-link:hover .search-text {
            color: white;
        }

        .search-shortcuts {
            margin-left: auto;
            display: none;
            align-items: center;
            gap: 0.375rem;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .search-shortcuts {
                display: flex;
            }
        }

        .search-bar-link:hover .search-shortcuts {
            opacity: 1;
        }

        .shortcut-key {
            padding: 0.125rem 0.375rem;
            border-radius: 0.375rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 10px;
            color: var(--dw-muted);
            font-family: var(--font-sans);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        /* Navigation Dots */
        .nav-dots-container {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 50;
            pointer-events: auto;
        }

        @media (min-width: 900px) {
            .nav-dots-container {
                right: 1.5rem;
            }
        }

        .nav-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .nav-dot:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .nav-dot.active {
            width: 0.75rem;
            height: 0.75rem;
            background-color: white;
            margin: -0.125rem 0;
            /* Keeps it centered relative to smaller dots */
        }

        /* Anpassung für die Suchleiste auf mobilen Geräten */
        @media (max-width: 900px) {
            .search-overlay {
                left: calc(50% + 25px);
                /* Verschiebt die Zentrierung um 25px nach rechts */
                width: calc(75vw - 25px);
                /* Reduziert die Breite leicht, damit sie rechts nicht aus dem Bildschirm ragt */
            }
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <img src="../images/lila.jpg" alt="background Image" id="background-img"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">

    <!-- Suchleiste als absolut positioniertes Overlay -->
    <div class="search-overlay">
        <div class="search-bar-wrapper">
            <a href="search.html" class="search-bar-link">
                <div class="search-bar-inner">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <span class="search-text">Suchen nach Artists, Releases...</span>
                    <div class="search-shortcuts">
                        <kbd class="shortcut-key">⌘</kbd>
                        <kbd class="shortcut-key">K</kbd>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- The actual visual part stays fixed on screen -->
    <main class="main-container">

        <div class="dynamic-scene">

            <!-- Carousel Container -->
            <div id="carousel" class="carousel-container">

                <!-- Karte 1 -->
                <div class="bento-card glass" data-content="../cards/card1.html">
                    <div class="loading-text">Lade Inhalt...</div>
                </div>

                <!-- Karte 2 -->
                <div class="bento-card glass" data-content="../cards/card2.html">
                    <div class="loading-text">Lade Inhalt...</div>
                </div>

                <!-- Karte 3 -->
                <div class="bento-card glass" data-content="../cards/card3.html">
                    <div class="loading-text">Lade Inhalt...</div>
                </div>

                <!-- Karte 4 -->
                <div class="bento-card glass" data-content="../cards/card4.html">
                    <div class="loading-text">Lade Inhalt...</div>
                </div>

                <!-- Karte 5 -->
                <div class="bento-card glass" data-content="../cards/card5.html">
                    <div class="loading-text">Lade Inhalt...</div>
                </div>

            </div>
        </div>

        <!-- Scroll Progress Indicators (Dots) -->
        <div class="nav-dots-container">
            <button class="nav-dot active" data-index="0"></button>
            <button class="nav-dot" data-index="1"></button>
            <button class="nav-dot" data-index="2"></button>
            <button class="nav-dot" data-index="3"></button>
            <button class="nav-dot" data-index="4"></button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const carousel = document.getElementById('carousel');
            const cards = document.querySelectorAll('.bento-card');
            const navDots = document.querySelectorAll('.nav-dot');

            const numCards = cards.length;
            const angleStep = 360 / numCards;
            let radius = 0;

            function setupCarousel() {
                const cardHeight = cards[0].offsetHeight;
                const gap = 30;

                radius = Math.round(((cardHeight + gap) / 2) / Math.tan(Math.PI / numCards));

                cards.forEach((card, index) => {
                    const angle = index * -angleStep;
                    card.style.transform = `rotateX(${angle}deg) translateZ(${radius}px)`;
                });
            }

            setupCarousel();
            window.addEventListener('resize', () => {
                setupCarousel();
                carousel.style.transform = `rotateX(${currentRotation}deg)`;
            });

            let currentRotation = 0;
            let targetRotation = 0;
            let scrollTimeout;
            const SENSITIVITY = 0.15;

            window.addEventListener('wheel', (e) => {
                targetRotation += e.deltaY * SENSITIVITY;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
                }, 150);
            }, { passive: false });

            let touchStartY = 0;
            let touchLastY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchLastY = touchStartY;
                clearTimeout(scrollTimeout);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                const touchCurrentY = e.touches[0].clientY;
                const deltaY = touchLastY - touchCurrentY;
                targetRotation += deltaY * (SENSITIVITY * 1.5);
                touchLastY = touchCurrentY;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
                }, 100);
            });

            navDots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    const currentSnapIndex = Math.round(targetRotation / angleStep);
                    let diff = index - (currentSnapIndex % numCards);

                    if (currentSnapIndex < 0 && diff > 0) diff -= numCards;
                    if (currentSnapIndex > 0 && diff < 0) diff += numCards;

                    if (diff > numCards / 2) diff -= numCards;
                    if (diff < -numCards / 2) diff += numCards;

                    targetRotation = (currentSnapIndex + diff) * angleStep;
                });
            });

            function animate() {
                currentRotation += (targetRotation - currentRotation) * 0.08;
                carousel.style.transform = `rotateX(${currentRotation}deg)`;

                let activeIndex = Math.round(currentRotation / angleStep) % numCards;
                if (activeIndex < 0) activeIndex += numCards;

                cards.forEach((card, index) => {
                    let worldAngle = (index * -angleStep + currentRotation) % 360;
                    if (worldAngle > 180) worldAngle -= 360;
                    if (worldAngle < -180) worldAngle += 360;

                    const distance = Math.abs(worldAngle);
                    const opacity = Math.max(0, 1 - (distance / 60));
                    const blurAmount = Math.min(20, distance / 3);

                    card.style.opacity = opacity;
                    card.style.filter = `blur(${blurAmount}px)`;

                    if (distance < 15) {
                        card.style.pointerEvents = 'auto';
                        card.classList.add('active');
                    } else {
                        card.style.pointerEvents = 'none';
                        card.classList.remove('active');
                    }
                });

                navDots.forEach((d, i) => {
                    if (i === activeIndex) {
                        d.classList.add('active');
                    } else {
                        d.classList.remove('active');
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
        });

        async function loadCardContents() {
            const cards = document.querySelectorAll('.bento-card');

            for (let card of cards) {
                const url = card.getAttribute('data-content');
                if (!url) continue;

                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const html = await response.text();
                        card.innerHTML = html;
                    } else {
                        card.innerHTML = `<div style="color: #ef4444; text-align: center; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">Konnte ${url} nicht laden.</div>`;
                    }
                } catch (error) {
                    console.error('Netzwerkfehler:', error);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadCardContents);
    </script>
</body>

</html>
