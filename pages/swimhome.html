        <span class="music-note"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"

        </span>

            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </span>
        <span class="music-note"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <div class="bento-card card-profile">

    </div>
    <div class="bento-card card-game">

  </div>
  <!-- Das Pop-up (Modal) -->
  <div id="filter-modal" class="modal-overlay">
    <!-- Die eigentliche Filter-Box -->
    <div class="modal-content">

      <!-- Ein Schließen-Button (X) -->

      <!-- Hier fügst du später den HTML-Code für dein Filter-Menü (Dialekt, Slider etc.) ein -->
      <div class="dropdown-row">
        <div class="custom-select-wrapper" id="sel-dialekt">
          <div class="custom-select-trigger"><span>Dialekt</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">

            <span class="custom-option" data-value="bs">Baseldütsch</span>
          </div>
          <input type="hidden" class="hidden-val" value="">
        </div>
        <div class="custom-select-wrapper" id="sel-genre">
          <div class="custom-select-trigger"><span>Genre</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">
            <span class="custom-option" data-value="rap">Rap</span>
            <span class="custom-option" data-value="drill">Drill</span>
            <span class="custom-option" data-value="pop">Pop</span>
          </div>
          <input type="hidden" class="hidden-val" value="">
        </div>
        <div class="custom-select-wrapper" id="sel-aktiv">
          <div class="custom-select-trigger"><span>Aktiv seit</span>
            <div class="arrow">▼</div>
          </div>
          <div class="custom-select-options">
            <span class="custom-option" data-value="2020">2020+</span>
            <span class="custom-option" data-value="2015">2015+</span>
            <span class="custom-option" data-value="alle">Alle</span>

          <input type="hidden" class="hidden-val" value="">
        </div>
      </div>

      <div class="slider-section">
        <div class="section-title">Zuhörerspanne (Spotify)</div>
        <div class="histogram" id="histogram"></div>
        <div class="slider-wrapper">
          <div class="slider-track"></div>
          <div class="slider-fill" id="slider-fill"></div>
          <input type="range" min="0" max="300" value="0" id="slider-min">
          <input type="range" min="0" max="300" value="300" id="slider-max">
        </div>
        <div class="min-max-row">
          <div class="input-group">
            <span class="input-label">Minimum</span>
            <input type="text" class="input-box" id="input-min" value="0">
          </div>
          <div class="input-group" style="align-items: flex-end;">
            <span class="input-label">Maximum</span>
            <input type="text" class="input-box" id="input-max" value="300k">
          </div>
        </div>
      </div>

      <button type="button" onclick="searchArtists()">Suchen</button>
    </div>
  </div>
  <script>
    let player;

    // 3. This specific function name is required by YouTube's API library
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '360',
        width: '640',
        videoId: 'SR5sxe1IQUo', // Replace with your YouTube Video ID
        playerVars: {
          'autoplay': 1,       // Auto-starts the video
          'mute': 0            // Required for autoplay on modern browsers
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Play video automatically as soon as it's ready
    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // 4. State Listener: Detect when playback reaches the end
    function onPlayerStateChange(event) {
      // YT.PlayerState.ENDED evaluates to 0
      if (event.data === YT.PlayerState.ENDED) {
        nextArtist();
      }
    }
  </script>

  <script>
    let artists = [];
    let currentArtist = -1;

    function searchArtists() {
      fetch('search_artists.php') // TODO: add search criterias (dialekt, genre, zuhörer min/max, ...)
        .then(response => response.text())
        .then(script => {
          eval(script);
          //console.log(artists.length);

          // show the first artist
          refreshArtist();

          // close the popup (falls vorhanden)
          if (typeof modal !== 'undefined' && modal.classList) {
            modal.classList.remove('active');
          }
        });
    }

    function nextArtist() {
      currentArtist++;
      if (currentArtist >= artists.length)
        currentArtist = 0;

      refreshArtist();
    }

    function prevArtist() {
      currentArtist--;
      if (currentArtist < 0)
        currentArtist = artists.length - 1;

      refreshArtist();
    }


    function refreshArtist() {
      if (!artists || artists.length === 0 || currentArtist < 0) return;

      const artist = artists[currentArtist];

      // Texte und Bilder aktualisieren
      document.getElementById('profile-name').innerHTML = artist.name;

      const profileImg = document.getElementById('profile-img');
      profileImg.setAttribute('src', artist.imageURL);
      document.getElementById('background-img').setAttribute('src', artist.imageURL);

      // --- YOUTUBE VIDEO UPDATE FIX ---
      const videoId = artist.youtubeVideoId;

      // 1. Desktop: Den offiziellen YouTube API Player nutzen
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      }

      // 2. Mobile: Nur die iframes updaten, die NICHT von der API gesteuert werden!
      // Wenn man die src vom API-Player hart ändert, geht er nämlich kaputt.
      const allIframes = document.querySelectorAll('.card-youtube iframe, .mobile-drawer-wrapper iframe');
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;

      allIframes.forEach(iframe => {
        // Wir fassen den Hauptplayer nicht an, nur die mobilen Klone
        if (iframe.id !== 'youtube-player') {
          iframe.src = embedUrl;
        }
      });

    }

    searchArtists();
  </script>

  <script>
    // JavaScript für das Handy zum Öffnen/Schließen
    function toggleMobilePanel() {
      const drawer = document.getElementById('mobileDrawer');
      const arrow = document.getElementById('drawerArrow'); // Zielt nur auf den Pfeil

      if (!drawer || !arrow) return;

      drawer.classList.toggle('open');

      // Pfeilrichtung ändern
      if (drawer.classList.contains('open')) {
        arrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
      } else {
        arrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
      }
    }

    // Like Button
    const likeButton = document.getElementById('like-button');
    if (likeButton) {
      likeButton.addEventListener('click', function () {
        this.classList.toggle('liked');
      });
    }

    // Filter Modal Steuerung
    const openBtn = document.getElementById('open-filter-btn');
    const closeBtn = document.getElementById('close-filter-btn');
    const modal = document.getElementById('filter-modal');

    if (openBtn && modal) {
      openBtn.addEventListener('click', () => {
        modal.classList.add('active');
      });
    }

    if (closeBtn && modal) {
      closeBtn.addEventListener('click', () => {
        modal.classList.remove('active');
      });
    }

    if (modal) {
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          modal.classList.remove('active');
        }
      });
    }
  </script>

</body>

</html>
