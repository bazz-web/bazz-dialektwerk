    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        dw: {
                            bg: '#0a0a0c', // Deep dark background from references
                            card: '#16161a', // Slightly lighter for cards
                            cardHover: '#1c1c21',
                            accent: '#8b5cf6', // The purple accent from the magazine cards
                            accentLight: '#a78bfa',
                            red: '#ef4444', // Red from the video player image
                            text: '#f3f4f6',
                            muted: '#9ca3af',
                            glass: 'rgba(22, 22, 26, 0.6)',
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'purple-glow': 'radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.15), transparent 50%)',
                        'red-glow': 'radial-gradient(circle at top right, rgba(239, 68, 68, 0.1), transparent 40%)',
                    }
                }
            }
        }

    <style>
        /* Custom scrollbar matching dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }

        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(16, 16, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Smooth input focus transition */
        input:focus {
            box-shadow: none;
        }

        /* Focus ring for accessibility without ruining design */
        .focus-ring-custom:focus-within {
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.5);
        }

        /* Custom Scrollbar for inner elements if needed */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* Text gradient animation */
        .text-gradient-animate {
            background-size: 200% auto;
            animation: textShine 4s linear infinite;
        }

        @keyframes textShine {
            to {
                background-position: 200% center;
            }
        }

        /* Card hover effects */
        .fancy-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fancy-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        /* Filter Button active state */
        .filter-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.5);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 6s linear infinite;
        }

        .search-focus-glow {
            transition: opacity 0.5s ease;
            opacity: 0.2;
        }

        .search-container:focus-within .search-focus-glow {
            opacity: 0.7;
        }

        .search-layout-transition {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .centered-mode {
            transform: translateY(25vh);
        }

        .top-mode {
            transform: translateY(8vh);
        }

        .fade-out-up {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
    </style>
</head>

<body
    class="bg-[#0a0a0c] text-dw-text font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-dw-accent selection:text-white">
    <div id="navbar-placeholder"></div>
    <!-- Ambient Background Glows -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[10%] left-[10%] w-[60vw] h-[60vw] rounded-full bg-dw-accent/10 blur-[120px] mix-blend-screen opacity-40 animate-pulse"
            style="animation-duration: 8s;"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[50vw] h-[50vw] rounded-full bg-dw-red/10 blur-[120px] mix-blend-screen opacity-20 animate-pulse"
            style="animation-duration: 12s;"></div>
    </div>

    <!-- Main Search Area -->
    <main class="flex-grow flex flex-col items-center px-4 sm:px-6 lg:px-8 z-10 w-full min-h-screen relative">

        <!-- Animated Search Wrapper: Using Flex gap-8 to strictly prevent overlapping -->
        <div id="search-wrapper"
            class="w-full max-w-4xl flex flex-col items-center justify-center gap-8 search-layout-transition centered-mode relative z-20">

            <!-- Intro Header -->
            <div class="text-center transition-all duration-500 w-full" id="search-header">
                <h1
                    class="text-5xl md:text-7xl lg:text-8xl font-serif font-bold text-white tracking-tight leading-tight mb-4 drop-shadow-2xl">
                    DW <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-dw-accent via-pink-500 to-dw-red text-gradient-animate">SEARCH</span>
                </h1>
                <p class="text-dw-muted text-lg md:text-xl font-light tracking-wide">Suche nach Artists,
                    Magazin-Artikeln oder Releases.</p>
            </div>

            <!-- Search Container -->
            <div class="search-container relative w-full max-w-3xl group mx-auto z-30">
                <div
                    class="search-focus-glow absolute -inset-8 bg-gradient-to-r from-dw-accent via-fuchsia-600 to-dw-red rounded-[3rem] blur-3xl">
                </div>

                <div
                    class="relative p-[1px] rounded-[2.5rem] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] bg-white/5">
                    <div
                        class="absolute inset-[-50%] bg-[conic-gradient(from_0deg,transparent_0_340deg,rgba(139,92,246,1)_360deg)] animate-spin-slow opacity-30 group-focus-within:opacity-100 transition-opacity duration-700">
                    </div>
                    <div
                        class="absolute inset-[-50%] bg-[conic-gradient(from_180deg,transparent_0_340deg,rgba(239,68,68,1)_360deg)] animate-spin-slow opacity-30 group-focus-within:opacity-100 transition-opacity duration-700">
                    </div>

                    <div
                        class="relative bg-black/90 backdrop-blur-3xl rounded-[2.5rem] flex items-center px-6 md:px-8 py-3 h-20 md:h-24 transition-all duration-500 group-hover:bg-[#0a0a0c]">
                        <i
                            class="fa-solid fa-magnifying-glass text-2xl md:text-3xl text-dw-muted/40 group-focus-within:text-dw-accent transition-colors duration-500"></i>

                        <input type="text" id="search-input"
                            class="w-full h-full bg-transparent border-none text-white text-3xl md:text-4xl placeholder-dw-muted/20 focus:ring-0 px-6 pt-2 pb-4 outline-none font-medium font-serif leading-relaxed"
                            placeholder="Suchen..." autocomplete="off" autofocus>
                        <div class="flex items-center gap-3">
                            <button id="clear-search"
                                class="hidden w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-dw-muted hover:text-white transition-all duration-300">
                                <i class="fa-solid fa-xmark text-xl"></i>
                            </button>
                            <button id="open-filter-btn"
                                class="h-14 w-14 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 hover:bg-gray-200 transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] group/btn">
                                <i
                                    class="fa-solid fa-sliders text-xl group-hover/btn:scale-110 transition-transform duration-300 pointer-events-none"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Tags -->
            <div class="flex flex-wrap justify-center gap-3 transition-all duration-500 w-full relative z-10"

                <button
                    class="filter-btn active px-6 py-2.5 rounded-full bg-white/5 backdrop-blur-md border border-white/10 text-sm font-medium text-white hover:bg-white/10 transition-all duration-300">Alles</button>
                <button

                <button

                <button
                    class="filter-btn px-6 py-2.5 rounded-full bg-white/5 backdrop-blur-md border border-white/10 text-sm font-medium text-dw-muted hover:text-white hover:bg-white/10 transition-all duration-300">Events</button>
            </div>
        </div>

        <!-- Search Results Container -->
        <div id="search-results"
            class="hidden w-full max-w-4xl mx-auto mt-8 mb-24 opacity-0 transition-all duration-700 transform translate-y-8">

            <div class="flex items-center justify-between border-b border-white/5 pb-4 mb-8"
                id="result-header-container">
                <h2 class="text-xl md:text-2xl font-serif text-white">

            </div>

            <!-- LEERER CONTAINER FÜR DIE DYNAMISCHEN ERGEBNISSE -->
            <div id="results-container" class="flex flex-col gap-5">
                <!-- JavaScript wird hier die Karten einfügen -->
            </div>

            <!-- Empty State -->
            <div id="no-results" class="hidden text-center py-24">

                    <div
                        class="absolute inset-0 border border-white/10 rounded-full animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]">
                    </div>
                    <div

                    </div>
                    <div
                        class="absolute inset-0 bg-white/5 backdrop-blur-xl rounded-full border border-white/10 flex items-center justify-center">
                        <i class="fa-solid fa-ghost text-4xl text-dw-muted"></i>

                </div>
                <h3 class="font-serif text-3xl font-bold text-white mb-4">Stille. Nichts gefunden.</h3>

                        class="text-white italic">"<span id="no-result-term"></span>"</span>. Probier es mit einem
                    anderen Begriff.</p>
            </div>
        </div>

        <div id="filter-modal-container"></div>
    </main>

            ];

            // Restliche 114 Einträge generieren
            const generatedData = [];
            const ortschaften = ['Bern', 'Zürich', 'Basel', 'Luzern', 'Biel', 'Thun'];
            const genres = ['Rap', 'Hip-Hop', 'Trap', 'Mundart-Pop'];
            const typen = ['Künstler', 'Release', 'Reviews', 'Events'];

            for (let i = 7; i <= 120; i++) {
                let typ = typen[Math.floor(Math.random() * typen.length)];
                let ort = ortschaften[Math.floor(Math.random() * ortschaften.length)];
                let genre = genres[Math.floor(Math.random() * genres.length)];

                generatedData.push({
                    id: i,
                    type: typ,
                    title: typ === 'Künstler' ? `Local Act #${i}` : typ === 'Release' ? `Mixtape Vol. ${i}` : typ === 'Events' ? `Konzert in ${ort}` : `Review: ${genre} Hype`,
                    desc: `Ein spannender Eintrag aus dem Bereich ${typ}. Fokus auf die Szene in ${ort}.`,
                    img: `https://placehold.co/400x400/16161a/${typ === 'Künstler' ? 'ef4444' : '8b5cf6'}?text=${typ}+${i}`,
                    tags: [ort, genre, typ.toLowerCase()]
                });
            }

            const database = [...baseDatabase, ...generatedData];

            // --- 2. SUCH-LOGIK ---
            function searchDatabase(term, filterType) {
                if (!term) return [];
                term = term.toLowerCase();

                return database.filter(item => {
                    if (filterType !== 'Alles' && item.type !== filterType) return false;
                    const matchTitle = item.title.toLowerCase().includes(term);
                    const matchDesc = item.desc.toLowerCase().includes(term);
                    const matchTags = item.tags.some(tag => tag.toLowerCase().includes(term));
                    return matchTitle || matchDesc || matchTags;
                });
            }

            // --- 3. RENDER-LOGIK ---
            function renderResults(results) {
                // Container radikal leeren!
                resultsContainer.innerHTML = '';

                if (results.length === 0) {
                    noResults.classList.remove('hidden');
                    resultHeaderContainer.classList.add('hidden');
                } else {
                    noResults.classList.add('hidden');
                    resultHeaderContainer.classList.remove('hidden');
                    resultCount.textContent = results.length;

                    results.forEach(item => {
                        const isArtist = item.type === 'Künstler';
                        const color = isArtist ? 'dw-red' : 'dw-accent';
                        const shadow = isArtist ? 'bg-dw-red/20' : 'bg-dw-accent/20';

                        const html = `
                    <a href="#" class="group relative flex flex-col sm:flex-row gap-6 p-4 rounded-[2rem] bg-black/30 backdrop-blur-xl border border-white/5 hover:bg-white/5 hover:border-white/20 transition-all duration-500 overflow-hidden">
                        <div class="absolute -right-20 -top-20 w-64 h-64 ${shadow} blur-[80px] opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
                        <div class="w-full sm:w-48 aspect-[16/9] sm:aspect-square rounded-[1.5rem] bg-[#111] overflow-hidden relative flex-shrink-0">
                            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700">
                            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold text-${color} uppercase tracking-widest border border-white/10">
                                ${item.type}
                            </div>
                        </div>
                        <div class="flex flex-col justify-center py-2 z-10 pr-4 w-full">
                            <h3 class="${isArtist ? 'font-sans tracking-tight' : 'font-serif'} text-2xl md:text-3xl font-bold text-white mb-2 group-hover:text-${color} transition-colors">
                                ${item.title}
                            </h3>
                            <p class="text-dw-muted text-base line-clamp-2 mb-4">${item.desc}</p>
                            <div class="flex items-center gap-3 mt-auto flex-wrap">
                                ${item.tags.map(tag => `<span class="px-4 py-1.5 rounded-full bg-white/5 text-xs text-white border border-white/10 hover:bg-white/10 transition-colors">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </a>
                `;
                        resultsContainer.insertAdjacentHTML('beforeend', html);
                    });
                }
            }

            // --- 4. EVENT LISTENER ---
            function triggerSearch() {
                const term = searchInput.value.trim();
                if (term.length > 0) {
                    const results = searchDatabase(term, currentFilter);
                    searchTermDisplay.textContent = term;
                    noResultTermDisplay.textContent = term;

                    searchResults.classList.remove('hidden');
                    setTimeout(() => {
                        searchResults.classList.remove('opacity-0', 'translate-y-8');
                        searchResults.classList.add('opacity-100', 'translate-y-0');
                    }, 50);
                    renderResults(results);
                }
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim();
                if (term.length > 0) {
                    clearBtn.classList.remove('hidden');
                    clearBtn.classList.add('flex');
                    searchWrapper.classList.remove('centered-mode');
                    searchWrapper.classList.add('top-mode');
                    searchHeader.classList.add('fade-out-up');
                } else {
                    clearBtn.classList.add('hidden');
                    clearBtn.classList.remove('flex');
                    hideResults();
                }
                clearTimeout(timeout);
                if (term !== '') {
                    timeout = setTimeout(() => triggerSearch(), 300);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
                clearBtn.classList.add('hidden');
                clearBtn.classList.remove('flex');
                hideResults();
            });

            function hideResults() {
                searchResults.classList.add('opacity-0', 'translate-y-8');
                searchResults.classList.remove('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    searchResults.classList.add('hidden');
                    searchWrapper.classList.remove('top-mode');
                    searchWrapper.classList.add('centered-mode');
                    searchHeader.classList.remove('fade-out-up');
                }, 500);
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active', 'text-white', 'bg-white/10');
                        b.classList.add('text-dw-muted', 'bg-white/5');
                    });
                    btn.classList.add('active', 'text-white', 'bg-white/10');
                    btn.classList.remove('text-dw-muted');
                    currentFilter = btn.textContent.trim();
                    if (searchInput.value.trim().length > 0) triggerSearch();
                });
            });

            const mainFilterBtn = document.getElementById('open-filter-btn');
            if (mainFilterBtn) {
                mainFilterBtn.addEventListener('click', (e) => {
