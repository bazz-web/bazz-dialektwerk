<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="../common/kigostyle.css">
  <link rel="stylesheet" href="../common/filter.css">
  <link rel="stylesheet" href="../common/navbar.css">
  <link rel="stylesheet" href="fds.css">
  <script src="../common/filter.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../common/navbar.js" defer></script>
  <title>Finde deinen Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>


  <div id="navbar-placeholder"></div>
  <img src="../images/gino.jpg" alt="Artist Image" id="background-img">

  <div class="bento-grid" id="mainContainer">

    <div class="bento-card card-buttons">
      <button class="nav-btn" id="like-button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
          </path>
        </svg>
      </button>
      <button class="nav-btn" id="open-filter-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <!-- Obere Reihe -->
          <line x1="3" y1="6" x2="11" y2="6"></line>
          <circle cx="14" cy="6" r="2"></circle>
          <line x1="17" y1="6" x2="21" y2="6"></line>

          <!-- Mittlere Reihe -->
          <line x1="3" y1="12" x2="5" y2="12"></line>
          <circle cx="8" cy="12" r="2"></circle>
          <line x1="11" y1="12" x2="21" y2="12"></line>

          <!-- Untere Reihe -->
          <line x1="3" y1="18" x2="13" y2="18"></line>
          <circle cx="16" cy="18" r="2"></circle>
          <line x1="19" y1="18" x2="21" y2="18"></line>
        </svg>

      </button>
      <button class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5"></line>
        </svg>
      </button>
      <button class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>

    </div>
    <div class="bento-card card-profile">
      <img src="../images/gino.jpg" alt="Artist Image" id="profile-img">
      <div class="profile-info">
        <h1>gino</h1>
      </div>
    </div>

    <div class="bento-card card-youtube">
      <iframe src="https://www.youtube.com/embed/1RxQHtQdG1I?si=RUqgPebGbfPQQ1Ow" title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>

  </div>
  <div id="filter-modal-container"></div>
  <script>
    // Wähle den Button aus (hier angenommen, er hat die ID "like-button")
    const likeButton = document.getElementById('like-button');

    // Füge einen Klick-Zuhörer (Event Listener) hinzu
    likeButton.addEventListener('click', function () {
      // 'toggle' fügt die Klasse 'liked' hinzu, wenn sie fehlt, 
      // und entfernt sie, wenn sie bereits da ist.
      this.classList.toggle('liked');
    });
  </script>

</body>

</html>
