<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel lesen - DW News</title>

    <!-- Google Fonts für Zeitungs-Flair und moderne Lesbarkeit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../favicon/site.webmanifest" />

    <style>
        :root {
            --bg-color: #0b0b0e;
            /* Sehr dunkler Hintergrund wie im Editor */
            --surface-color: #16161b;
            /* Leiste/Karten */
            --border-color: #272730;
            --text-main: #e2e2e8;
            --text-muted: #8b8b9d;
            --accent-color: #6d42c7;
            /* Violett aus deiner Sidebar */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* Hauptbereich (Sidebar-Abstand entfernt) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Schwebende Top-Bar wie im Editor */
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 16px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 50px;
            position: sticky;
            top: 20px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .toolbar-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .separator {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
        }

        /* Artikel-Container */
        .article-container {
            width: 100%;
            max-width: 680px;
            /* Optimale Breite zum Lesen */
            padding-bottom: 100px;
        }

        /* Kategorie-Pill */
        .category-pill {
            display: inline-block;
            background-color: #22222d;
            color: #9d9db6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        /* Überschrift (Zeitungs-Stil) */
        .article-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Metadaten (Autor, Datum) */
        .article-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--surface-color);
            object-fit: cover;
        }

        .meta-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .author-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .publish-info {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Hero Image */
        .hero-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 40px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
        }

        /* Fließtext / Body */
        .article-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #d1d1db;
            font-weight: 300;
        }

        .article-body p {
            margin-bottom: 24px;
        }

        /* Der Newspaper-Effekt: Drop Cap (Initiale) */
        .drop-cap::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            line-height: 0.7;
            padding-top: 8px;
            padding-right: 12px;
            padding-left: 2px;
            color: #ffffff;
        }

        /* Zwischenüberschriften */
        .article-body h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #ffffff;
            margin: 48px 0 20px 0;
            line-height: 1.3;
        }

        /* Zitate im Text */
        .article-body blockquote {
            border-left: 3px solid var(--accent-color);
            margin: 40px 0;
            padding: 10px 0 10px 24px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.5rem;
            line-height: 1.5;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <main class="main-content">

        <!-- Editor-Style Top Bar -->
        <header class="editor-toolbar">
            <div class="toolbar-group">
                <button class="icon-btn" onclick="history.back()" title="Zurück"><i
                        class="fas fa-arrow-left"></i></button>
                <div class="separator"></div>
                <span style="color: var(--text-muted); font-size: 0.85rem;">Artikel lesen</span>
            </div>
            <div class="toolbar-group">
                <button class="icon-btn" title="Lesezeichen"><i class="far fa-bookmark"></i></button>
                <button class="icon-btn" title="Teilen"><i class="fas fa-share-alt"></i></button>
                <div class="separator"></div>
                <button class="icon-btn" title="Optionen"><i class="fas fa-ellipsis-h"></i></button>
            </div>
        </header>

        <!-- Dynamischer Artikel-Container -->
        <article class="article-container">

            <span id="article-category" class="category-pill">Kategorie</span>

            <h1 id="article-title" class="article-title">Lade Artikel...</h1>

            <div class="article-meta" id="article-meta-container" style="display: none;">
                <img src="" id="article-avatar" alt="Autor" class="author-avatar">
                <div class="meta-text">
                    <span id="article-author" class="author-name">Autor</span>
                    <span id="article-date" class="publish-info">Datum</span>
                </div>
            </div>

            <!-- Titelbild -->
            <img id="article-image" src="" alt="Artikel Bild" class="hero-image" style="display: none;">

            <div id="article-content" class="article-body">
                <!-- Text wird per JavaScript geladen -->
            </div>

        </article>
    </main>

    <script>
        // Datenbank-Simulation: Hier liegen alle Artikel
        const articleDatabase = {
            "zueri-west": {
                category: "Release",
                title: "Mundart Release DJ",
                author: "Von der DW Redaktion",
                date: "12. August 2026 • 1 Min. Lesezeit",
                image: "../images/releasedj.png",
                content: `
                    <p class="drop-cap">Willst du wissen was in der Mundart Szene jede Woche so gedropt wird? Dann abonniere jetzt unsere Playlist auf Spotify und gib ihr einen Like. Die Playlist wird jeden Freitag von unserem MR DJ mit den Releases der letzten Woche geupdated. Verpasse so auch du keinen einzigen Mundart Release mehr.</p>
                    <br>
                    <p><strong>Der Link zur Spotify Playlist:</strong> <a href="https://open.spotify.com/playlist/3Hg6UFbvhpiUCBoIqoGLET" target="_blank">Mundart Release DJ</a></p>
                    
                `
            },
        };

        // Artikel anhand der URL laden (z.B. artikel.html?id=lo-leduc)
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            // Standardmäßig den Züri West Artikel laden, wenn keine ID in der URL steht
            const articleId = urlParams.get('id') || 'zueri-west';

            const articleData = articleDatabase[articleId];

            if (articleData) {
                // Daten ins HTML einfügen
                document.getElementById('article-category').textContent = articleData.category;
                document.getElementById('article-title').textContent = articleData.title;
                document.getElementById('article-author').textContent = articleData.author;
                document.getElementById('article-date').textContent = articleData.date;

                // Profilbild dynamisch generieren (basierend auf dem Autorennamen)
                document.getElementById('article-avatar').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(articleData.author) + '&background=22222d&color=fff';

                const imgElement = document.getElementById('article-image');
                imgElement.src = articleData.image;
                imgElement.style.display = "block"; // Bild sichtbar machen

                document.getElementById('article-content').innerHTML = articleData.content;
                document.getElementById('article-meta-container').style.display = "flex";
            } else {
                // Fehlerbehandlung, falls Artikel nicht gefunden wird
                document.getElementById('article-title').textContent = "Artikel nicht gefunden";
                document.getElementById('article-content').innerHTML = "<p>Der von dir gesuchte Artikel existiert leider nicht oder wurde entfernt.</p>";
                document.getElementById('article-category').style.display = "none";
            }
        });
    </script>

</body>

</html>
