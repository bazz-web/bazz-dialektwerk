<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bento Carousel Landingpage</title>
    <link rel="stylesheet" href="../common/kigostyle.css">
    <link rel="stylesheet" href="../common/navbar.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../common/navbar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Hier kommen die separaten Stylesheets für deine Karten rein -->
    <link rel="stylesheet" href="../cards/card1.css">
    <link rel="stylesheet" href="../cards/card2.css">
    <link rel="stylesheet" href="../cards/card3.css">
    <link rel="stylesheet" href="../cards/card4.css">
    <link rel="stylesheet" href="../cards/card5.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#0f1117',
                            800: '#1a1d27',
                            700: '#272b3a'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            color: white;
            font-family: 'Inter', sans-serif;
            scrollbar-width: none;
            -ms-overflow-style: none;
            overflow: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* 3D Scene Setup */
        .scene {
            perspective: 2500px;
            transform-style: preserve-3d;
        }

        .bento-card {
            transform-style: preserve-3d;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive 3D Scene - Urspruengliche, perfekt funktionierende Werte */
        .dynamic-scene {
            perspective: 2500px;
            top: calc(50% + 20px);
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 70vh;
        }

        @media (min-width: 900px) {
            .dynamic-scene {
                top: 50%;
                left: max(265px, calc(50vw - min(35vw, 550px)));
                transform: translateY(-50%);
                width: min(70vw, 1100px, calc(100vw - 230px - 120px));
                height: 70vh;
            }
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <img src="../images/lila.jpg" alt="background Image" id="background-img"
        style="position:fixed; z-index:-1; inset:0; width:100%; height:100%; object-fit:cover;">

    <!-- Suchleiste als absolut positioniertes Overlay, exakt zentriert und im gleichen Breitenbereich wie das Karussell -->
    <div
        style="position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); width: 75vw; z-index: 100; pointer-events: auto;">
        <div style="max-width: 700px; margin: 0 auto;">
            <a href="search.html"
                class="w-full group block relative p-[px] rounded-[2rem] overflow-hidden bg-white/5 border border-white/10 hover:border-white/20 hover:bg-white/10 transition-all duration-300 shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
                <div
                    class="relative bg-[#0a0a0c]/90 backdrop-blur-md rounded-[2rem] flex items-center px-6 py-2 h-9 transition-all duration-300">
                    <i
                        class="fa-solid fa-magnifying-glass text-lg text-dw-muted group-hover:text-dw-accent transition-colors duration-300"></i>
                    <span
                        class="ml-4 text-dw-muted/80 text-base font-serif tracking-wide group-hover:text-white transition-colors duration-300 truncate">
                        Suchen nach Artists, Releases...
                    </span>
                    <div
                        class="ml-auto hidden sm:flex items-center gap-1.5 opacity-50 group-hover:opacity-100 transition-opacity duration-300 flex-shrink-0">
                        <kbd
                            class="px-1.5 py-0.5 rounded-md bg-white/5 border border-white/10 text-[10px] text-dw-muted font-sans shadow-sm">⌘</kbd>
                        <kbd
                            class="px-1.5 py-0.5 rounded-md bg-white/5 border border-white/10 text-[10px] text-dw-muted font-sans shadow-sm">K</kbd>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- The actual visual part stays fixed on screen -->
    <main class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-10">

        <div class="dynamic-scene absolute pointer-events-auto">

            <!-- Carousel Container -->
            <div id="carousel" class="w-full h-full relative" style="transform-style: preserve-3d;">

                <!-- Karte 1 -->
                <div class="bento-card absolute inset-0 rounded-[2rem] glass p-6" data-content="../cards/card1.html">
                    <div class="flex justify-center items-center w-full h-full text-white/50">Lade Inhalt...</div>
                </div>

                <!-- Karte 2 -->
                <div class="bento-card absolute inset-0 rounded-[2rem] glass p-6" data-content="../cards/card2.html">
                    <div class="flex justify-center items-center w-full h-full text-white/50">Lade Inhalt...</div>
                </div>

                <!-- Karte 3 -->
                <div class="bento-card absolute inset-0 rounded-[2rem] glass p-6" data-content="../cards/card3.html">
                    <div class="flex justify-center items-center w-full h-full text-white/50">Lade Inhalt...</div>
                </div>

                <!-- Karte 4 -->
                <div class="bento-card absolute inset-0 rounded-[2rem] glass p-6" data-content="../cards/card4.html">
                    <div class="flex justify-center items-center w-full h-full text-white/50">Lade Inhalt...</div>
                </div>

                <!-- Karte 5 -->
                <div class="bento-card absolute inset-0 rounded-[2rem] glass p-6" data-content="../cards/card5.html">
                    <div class="flex justify-center items-center w-full h-full text-white/50">Lade Inhalt...</div>
                </div>

            </div>
        </div>

        <!-- Scroll Progress Indicators (Dots) -->
        <div
            class="absolute right-2 min-[900px]:right-6 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-50 pointer-events-auto">
            <button class="nav-dot w-4 h-4 rounded-full bg-white transition-all duration-300" data-index="0"></button>
            <button class="nav-dot w-3 h-3 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"
                data-index="1"></button>
            <button class="nav-dot w-3 h-3 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"
                data-index="2"></button>
            <button class="nav-dot w-3 h-3 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"
                data-index="3"></button>
            <button class="nav-dot w-3 h-3 rounded-full bg-white/30 hover:bg-white/60 transition-all duration-300"
                data-index="4"></button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const carousel = document.getElementById('carousel');
            const cards = document.querySelectorAll('.bento-card');
            const navDots = document.querySelectorAll('.nav-dot');

            const numCards = cards.length;
            const angleStep = 360 / numCards;
            let radius = 0;

            function setupCarousel() {
                const cardHeight = cards[0].offsetHeight;
                const gap = 30;

                radius = Math.round(((cardHeight + gap) / 2) / Math.tan(Math.PI / numCards));

                cards.forEach((card, index) => {
                    const angle = index * -angleStep;
                    card.style.transform = `rotateX(${angle}deg) translateZ(${radius}px)`;
                });
            }

            setupCarousel();
            window.addEventListener('resize', () => {
                setupCarousel();
                carousel.style.transform = `rotateX(${currentRotation}deg)`;
            });

            let currentRotation = 0;
            let targetRotation = 0;
            let scrollTimeout;
            const SENSITIVITY = 0.15;

            window.addEventListener('wheel', (e) => {
                targetRotation += e.deltaY * SENSITIVITY;
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
                }, 150);
            }, { passive: false });

            let touchStartY = 0;
            let touchLastY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchLastY = touchStartY;
                clearTimeout(scrollTimeout);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                const touchCurrentY = e.touches[0].clientY;
                const deltaY = touchLastY - touchCurrentY;
                targetRotation += deltaY * (SENSITIVITY * 1.5);
                touchLastY = touchCurrentY;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    targetRotation = Math.round(targetRotation / angleStep) * angleStep;
                }, 100);
            });

            navDots.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    const currentSnapIndex = Math.round(targetRotation / angleStep);
                    let diff = index - (currentSnapIndex % numCards);

                    if (currentSnapIndex < 0 && diff > 0) diff -= numCards;
                    if (currentSnapIndex > 0 && diff < 0) diff += numCards;

                    if (diff > numCards / 2) diff -= numCards;
                    if (diff < -numCards / 2) diff += numCards;

                    targetRotation = (currentSnapIndex + diff) * angleStep;
                });
            });

            function animate() {
                currentRotation += (targetRotation - currentRotation) * 0.08;
                carousel.style.transform = `rotateX(${currentRotation}deg)`;

                let activeIndex = Math.round(currentRotation / angleStep) % numCards;
                if (activeIndex < 0) activeIndex += numCards;

                cards.forEach((card, index) => {
                    let worldAngle = (index * -angleStep + currentRotation) % 360;
                    if (worldAngle > 180) worldAngle -= 360;
                    if (worldAngle < -180) worldAngle += 360;

                    const distance = Math.abs(worldAngle);
                    const opacity = Math.max(0, 1 - (distance / 60));
                    const blurAmount = Math.min(20, distance / 3);

                    card.style.opacity = opacity;
                    card.style.filter = `blur(${blurAmount}px)`;

                    if (distance < 15) {
                        card.style.pointerEvents = 'auto';
                        card.classList.add('active');
                    } else {
                        card.style.pointerEvents = 'none';
                        card.classList.remove('active');
                    }
                });

                navDots.forEach((d, i) => {
                    if (i === activeIndex) {
                        d.classList.remove('bg-white/30', 'w-3', 'h-3');
                        d.classList.add('bg-white', 'w-4', 'h-4');
                    } else {
                        d.classList.remove('bg-white', 'w-4', 'h-4');
                        d.classList.add('bg-white/30', 'w-3', 'h-3');
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
        });

        async function loadCardContents() {
            const cards = document.querySelectorAll('.bento-card');

            for (let card of cards) {
                const url = card.getAttribute('data-content');
                if (!url) continue;

                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const html = await response.text();
                        card.innerHTML = html;
                    } else {
                        card.innerHTML = `<div class="text-red-500">Konnte ${url} nicht laden.</div>`;
                    }
                } catch (error) {
                    console.error('Netzwerkfehler:', error);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadCardContents);
    </script>
</body>

</html>
